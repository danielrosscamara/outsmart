<body class="bg-gradient-primary" style="background: linear-gradient(90deg, black 50%, #c89116 99%), var(--bs-focus-ring-color);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-12 col-xl-10">
                <div class="card shadow-lg my-5 o-hidden border-0">
                    <div class="card-body p-0">
                        <div class="row">
                            <div class="col-lg-6 d-none d-lg-flex" style="background: #000000;">
                                <div class="flex-grow-1 bg-login-image" style="background: url(&quot;assets/img/OutSmart_Icon-removebg-preview.png&quot;) center / auto, var(--bs-black);max-width: 100%;max-height: 100%;height: 580px;filter: brightness(99%) grayscale(0%);display: inline;position: static;"></div>
                            </div>
                            <div class="col-lg-6">
                                <div class="p-5">
                                    <div class="text-center"><img class="img-fluid hide-icon" width="500" height="500" style="background: url(&quot;assets/img/avatars/avatar5.jpeg&quot;) center / contain no-repeat;width: 100px;height: 80px;" src="assets/img/OutSmart%20Icon.png">
                                        <h4 class="text-dark mb-4">Welcome to OutSmart!</h4>
                                    </div>
                                    <form id="login-form" class="user">
                                        <div class="mb-3"><input class="form-control form-control-user" type="email" id="login-email" aria-describedby="emailHelp" placeholder="Enter Email Address..." name="email"></div>
                                        <div class="mb-3"><input class="form-control form-control-user" type="password" id="login-password" placeholder="Password" name="password"></div>
                                        <div class="mb-3">
                                            <div class="custom-checkbox small">
                                                <div class="form-check"><input class="form-check-input" type="checkbox" id="formCheck-1"><label class="form-check-label" for="formCheck-1">Remember Me</label></div>
                                            </div>
                                        </div><button class="btn btn-primary d-block w-100 btn-user" type="submit">Login</button>
                                        <hr><a class="btn btn-primary d-block w-100 mb-2 btn-google btn-user" role="button"><i class="fab fa-google"></i>&nbsp; Login with Google</a><a class="btn btn-primary d-block w-100 btn-facebook btn-user" role="button"><i class="fab fa-facebook-f"></i>&nbsp; Login with Facebook</a>
                                        <hr>
                                    </form>
                                    <div class="text-center"><a class="small" href="forgot-password.html">Forgot Password?</a></div>
                                    <div class="text-center"><a class="small" href="register.html">Create an Account!</a></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/clockpicker/0.0.7/bootstrap-clockpicker.min.js"></script>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/mobile-swipe-nav.js"></script>
</body>
